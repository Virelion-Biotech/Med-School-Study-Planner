name: Platform smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install runtime and test dependencies
        run: pip install -e '.[all]'
      - name: Compile planner
        run: python -m compileall -q planner scripts/platform_smoke.py
      - name: Frontend contract
        run: python scripts/frontend_contract.py
      - name: Platform smoke
        run: python scripts/platform_smoke.py
      - name: Backend/API regression tests
        run: pytest -q

name: Platform smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: Compile planner
        run: python -m compileall -q planner scripts/platform_smoke.py
      - name: Platform smoke
        run: python scripts/platform_smoke.py

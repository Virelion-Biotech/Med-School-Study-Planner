name: tests
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[all]'
      - run: python -m compileall planner tests scripts
      - run: pytest -q
      - run: python scripts/regression_gate.py --seeds 5 --days 14
      - name: Import all public planner modules
        run: python - <<'PY'
          import planner.health
          import planner.observability
          import planner.plan_policy
          print('planner platform imports: OK')
        PY
      - name: Verify clean health configuration
        run: python - <<'PY'
          from planner.health import planner_health
          report = planner_health(capacity_minutes=180, quantum_minutes=15, max_session_minutes=90)
          assert report.ready, report
          print(report)
        PY

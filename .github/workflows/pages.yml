name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Configure backend URL
        env:
          BACKEND_URL: ${{ vars.PLANNER_API_BASE }}
        run: |
          test -n "$BACKEND_URL" || { echo "Repository variable PLANNER_API_BASE is required"; exit 1; }
          python - <<'PY'
          from pathlib import Path
          import os
          p = Path('planner/static/pages-api-config.js')
          text = p.read_text()
          url = os.environ['BACKEND_URL'].rstrip('/')
          p.write_text(text.replace('__PLANNER_API_BASE__', url))
          PY

      - name: Check backend health (non-blocking)
        env:
          BACKEND_URL: ${{ vars.PLANNER_API_BASE }}
        continue-on-error: true
        run: |
          set +e
          test -n "$BACKEND_URL" || exit 0
          echo "Checking ${BACKEND_URL%/}/health"
          curl --fail --silent --show-error --location --max-time 20 "${BACKEND_URL%/}/health" >/tmp/planner-health.json
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "backend health: unavailable; continuing because the frontend has local-first recovery"
            exit 0
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/planner-health.json').read_text())
          print('backend health:', 'OK' if payload.get('status') == 'ok' else f"unexpected: {payload}")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./planner/static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

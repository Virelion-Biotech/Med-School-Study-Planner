name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Configure backend URL
        env:
          BACKEND_URL: ${{ vars.PLANNER_API_BASE }}
        run: |
          test -n "$BACKEND_URL" || { echo "Repository variable PLANNER_API_BASE is required"; exit 1; }
          python - <<'PY'
          from pathlib import Path
          import os
          p = Path('planner/static/api-config.js')
          text = p.read_text()
          url = os.environ['BACKEND_URL'].rstrip('/')
          p.write_text(text.replace('https://REPLACE_WITH_YOUR_BACKEND_URL', url))
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./planner/static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

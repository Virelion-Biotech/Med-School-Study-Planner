<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Med School Study Planner</title>
  <link rel="stylesheet" href="./static/styles.css" />
  <link rel="stylesheet" href="./static/admin.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">M</span><div><strong>Study Planner</strong><small>adaptive medical learning</small></div></div>
      <nav id="nav">
        <button class="nav-item active" data-view="today">Today</button>
        <button class="nav-item" data-view="week">Week</button>
        <button class="nav-item" data-view="curriculum">Curriculum</button>
        <button class="nav-item" data-view="exams">Exams</button>
        <button class="nav-item" data-view="insights">Insights</button>
      </nav>
      <div class="sidebar-foot"><span class="status-dot"></span><span id="engine-status">Connecting…</span></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div><p class="eyebrow">Adaptive planning</p><h1 id="page-title">Today</h1></div>
        <div class="toolbar"><button id="replan" class="btn primary">Replan week</button><button id="seed" class="btn ghost">Load demo</button></div>
      </header>
      <section id="view" class="view"></section>
    </main>
  </div>
  <div id="session-modal" class="modal hidden" aria-hidden="true">
    <div class="modal-card session-drawer">
      <div class="modal-head"><div><div class="eyebrow">Study session</div><h3 id="modal-title">Session</h3><div id="modal-meta" class="meta"></div></div><button id="modal-close" class="close" aria-label="Close">×</button></div>
      <div class="session-summary"><div><span>Planned</span><strong id="modal-planned">—</strong></div><div><span>Type</span><strong id="modal-type">—</strong></div><div><span>Subject</span><strong id="modal-subject">—</strong></div></div>
      <div class="form-grid"><div class="field"><label for="actual-minutes">Actual minutes</label><input id="actual-minutes" type="number" min="0" step="5" /></div><div class="field"><label for="score">Performance score</label><input id="score" type="number" min="0" max="1" step="0.01" placeholder="0.00–1.00" /></div></div>
      <div class="score-helper"><span>0.0 = missed / poor recall</span><span>0.75 = solid</span><span>1.0 = excellent</span></div>
      <div class="drawer-actions"><button id="modal-complete" class="btn primary">Complete session</button><button id="modal-replan" class="btn ghost">Complete + replan</button></div>
    </div>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script src="./static/api-config.js"></script>
  <script src="./static/app.js" defer></script>
  <script src="./static/admin.js" defer></script>
  <script src="./static/bridge.js" defer></script>
  <script src="./static/finalize.js" defer></script>
</body>
</html>

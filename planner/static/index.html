<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="theme-color" content="#0f766e"/>
  <title>Med School Study Planner</title>
  <link rel="stylesheet" href="./styles2.css"/>
  <link rel="stylesheet" href="./adaptive-v3.css"/>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><div class="brand-icon" aria-hidden="true">M</div><div><strong>Study Planner</strong><small>adaptive medical learning</small></div></div>
      <div class="side-label">PLAN</div>
      <nav id="nav" aria-label="Planner navigation">
        <button class="nav active" data-view="today" type="button">Today</button>
        <button class="nav" data-view="week" type="button">My Week</button>
        <button class="nav" data-view="curriculum" type="button">Curriculum</button>
        <button class="nav" data-view="exams" type="button">Exams</button>
        <button class="nav" data-view="insights" type="button">Progress</button>
      </nav>
      <div class="sidebar-tip"><span>CURRENT PLAN</span><strong>Study Plan</strong><small>Choose USMLE, school, or personal mode.</small></div>
      <div class="sidebar-status"><span class="dot" id="status-dot"></span><span id="status">Connecting…</span></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div><div class="kicker">MEDICAL STUDY PLANNER</div><h1 id="title">Today</h1><p id="subtitle">The sessions you should focus on today.</p></div>
        <div class="top-actions"><button class="btn secondary" id="reset-btn" type="button">Change plan</button><button class="btn secondary" id="mode-btn" type="button">Change mode</button><button class="btn primary" id="replan-btn" type="button" onclick="replanWeek()">Rebuild week</button></div>
      </header>
      <section id="view" aria-live="polite"></section>
    </main>
  </div>
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./api-config.js"></script>
  <script src="./pages-api-config.js"></script>
  <script src="./app.js" defer></script>
  <script src="./simple-setup.js" defer></script>
  <script src="./personal-v2.js" defer></script>
  <script src="./school-official.js" defer></script>
  <script src="./product-suite.js" defer></script>
  <script src="./advanced-import.js" defer></script>
  <script src="./ui-mode.js" defer></script>
  <script src="./runtime-audit.js" defer></script>
  <script src="./runtime-fixes.js" defer></script>
  <script src="./adaptive-v3.js" defer></script>
  <script src="./activity-ui.js" defer></script>
  <script src="./adaptive-calibration-ui.js" defer></script>
  <script src="./adaptive-why.js" defer></script>
  <script src="./sync-bridge.js" defer></script>
  <script src="./sync-ui.js" defer></script>
</body>
</html>

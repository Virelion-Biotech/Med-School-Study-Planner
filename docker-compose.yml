services:
  planner:
    build: .
    ports:
      - "8000:8000"
    environment:
      STUDY_PLANNER_DB: /data/study_planner.db
    volumes:
      - planner-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  planner-data:

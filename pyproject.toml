[project]
name = "med-school-study-planner"
version = "1.0.0a1"
description = "Adaptive, explainable medical study planning engine with memory, mastery, workload and constrained scheduling"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "ortools>=9.10,<10",
  "fsrs>=6.3,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]
all = ["pytest>=8,<9", "httpx>=0.27,<1]

[tool.poetry]
packages = [{ include = "planner" }]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

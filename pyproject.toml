[project]
name = "med-school-study-planner"
version = "0.7.0"
description = "Adaptive, fairness-constrained medical study planning engine with persistent learning feedback"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.8,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]
optimizer = ["ortools>=9.10,<10"]
all = ["pytest>=8,<9", "httpx>=0.27,<1", "ortools>=9.10,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

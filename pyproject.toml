[project]
name = "med-school-study-planner"
version = "0.4.0"
description = "Complexity-aware, fairness-constrained medical study scheduling engine with adaptive UI"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.8,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]
optimizer = ["ortools>=9.10,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
